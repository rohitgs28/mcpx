# mcpx gateway configuration
# Full documentation: https://github.com/rohitgs28/mcpx

listen: ":8080"

# Backend MCP servers to proxy
servers:
  - name: filesystem
    url: http://localhost:3001
    transport: http
    policy:
      # Only allow read operations
      allow_tools:
        - read_file
        - list_directory
        - search_files
      deny_tools:
        - write_file
        - delete_file

  - name: database
    url: http://localhost:3002
    transport: http
    policy:
      # Read-only mode: tools/list works, tools/call is blocked
      read_only: true

  - name: github
    url: http://localhost:3003
    transport: http
    policy:
      deny_tools:
        - delete_repository
        - delete_branch

# Authentication
auth:
  enabled: true
  type: bearer       # "bearer", "api_key", or "none"
  token: "your-secret-token-here"

# CORS — required for browser-based MCP clients
cors:
  enabled: true
  allowed_origins:
    - "*"             # or list specific origins
  allowed_methods:
    - GET
    - POST
    - OPTIONS
  allowed_headers:
    - Content-Type
    - Authorization
    - X-API-Key
    - Mcp-Session-Id
  max_age: "86400"

# Audit logging
audit:
  enabled: true
  output: stdout      # "stdout", "file", or "json"
  # path: /var/log/mcpx/audit.log  # required when output is "file"

# Rate limiting
rate_limit:
  enabled: true
  rps: 100            # global requests per second
  burst: 20           # burst capacity
  per_tool: true      # also rate limit per tool name
  tool_rps: 10        # per-tool requests per second
  tool_burst: 5       # per-tool burst

# Response inspection (tools/list)
inspection:
  # Pin each tool's full schema on first sighting and react to later changes,
  # defeating rug-pull/mutation (CVE-2025-54136), shadowing, and schema poisoning.
  #   off     — disabled
  #   warn    — log violations to the audit trail, pass the tool through
  #   enforce — log and drop the mutated tool from tools/list
  tool_integrity: warn
  # Strip policy-denied tools from tools/list so clients never see tools they
  # are not permitted to call.
  filter_tools_list: true
