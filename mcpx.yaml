# mcpx gateway configuration
# Full documentation: https://github.com/rohitgs28/mcpx

listen: ":8080"

# Backend MCP servers to proxy
servers:
  - name: filesystem
    url: http://localhost:3001
    transport: http   # "http" (default); "sse" is an alias — streaming responses are auto-detected
    policy:
      # Only allow read operations
      allow_tools:
        - read_file
        - list_directory
        - search_files
      deny_tools:
        - write_file
        - delete_file
      # Argument-level rules: constrain WHAT a tool may be called with.
      # Constraints per argument (ANDed): equals, one_of, prefix, suffix,
      # regex, required. Values compare as strings (bools/numbers
      # normalized); non-scalar values fail closed. prefix is a literal
      # check — no path canonicalization.
      tool_rules:
        read_file:
          args:
            path: { prefix: "/data/" }

  - name: database
    url: http://localhost:3002
    transport: http
    policy:
      # Read-only mode: tools/list works, tools/call is blocked
      read_only: true

  - name: github
    url: http://localhost:3003
    transport: http
    policy:
      deny_tools:
        - delete_repository
        - delete_branch

# Authentication
auth:
  enabled: true
  type: bearer       # "bearer", "api_key", "oauth", or "none"
  token: "your-secret-token-here"   # matches as client "default"
  # Named credentials give each caller an identity for per-client policies,
  # audit logs, and metrics:
  # clients:
  #   - { name: ci-bot,  token: "ci-secret" }
  #   - { name: analyst, token: "analyst-secret" }
  # For oauth, the client identity comes from a JWT claim (default "sub"):
  # identity_claim: sub

# Per-client policy overrides. The effective decision is the INTERSECTION
# of the server policy and the client's override: both must allow a call.
# Overrides can only restrict, never widen, the server baseline. Clients
# without an entry get the server policy as-is.
# clients:
#   ci-bot:
#     servers:
#       filesystem:
#         allow_tools: [read_file]
#         tool_rules:
#           read_file:
#             args:
#               path: { prefix: "/ci/" }

# CORS — required for browser-based MCP clients
cors:
  enabled: true
  allowed_origins:
    - "*"             # or list specific origins
  allowed_methods:
    - GET
    - POST
    - OPTIONS
  allowed_headers:
    - Content-Type
    - Authorization
    - X-API-Key
    - Mcp-Session-Id
  max_age: "86400"

# Audit logging
audit:
  enabled: true
  output: stdout      # "stdout", "file", or "json"
  # path: /var/log/mcpx/audit.log  # required when output is "file"

# Rate limiting
rate_limit:
  enabled: true
  rps: 100            # global requests per second
  burst: 20           # burst capacity
  per_tool: true      # also rate limit per tool name
  tool_rps: 10        # per-tool requests per second
  tool_burst: 5       # per-tool burst

# Response inspection (tools/list)
inspection:
  # Pin each tool's full schema on first sighting and react to later changes,
  # defeating rug-pull/mutation (CVE-2025-54136), shadowing, and schema poisoning.
  #   off     — disabled
  #   warn    — log violations to the audit trail, pass the tool through
  #   enforce — log and drop the mutated tool from tools/list
  tool_integrity: warn
  # Strip policy-denied tools from tools/list so clients never see tools they
  # are not permitted to call. Filtering is per client when auth provides an
  # identity. Note: when inspection is on, tools/list requests are pinned to
  # JSON responses (Accept rewritten) so streaming cannot bypass it; all
  # other SSE responses stream through untouched.
  filter_tools_list: true

# Circuit breaker: fail fast (503) per backend after repeated failures
# instead of queueing requests against a dead upstream. Settings are read
# once at startup so breaker state survives config hot-reloads.
circuit_breaker:
  enabled: true
  failure_threshold: 5   # consecutive failures (5xx or transport errors) that open the circuit
  cooldown: 30s          # how long to stay open before probing recovery
  half_open_max: 1       # concurrent probe requests while half-open
